# Configuration for Image2Biomass competition

preprocessing:
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  image_height: 256
  image_width: 256

hyperparameters:
  batch_size: 32 # Reduced from 64 - more stable gradients with unfrozen backbone
  learning_rate: 0.0007 # Reduced - warmup ramp to 0.001 caused epoch 5 collapse
  n_folds: 3
  epochs: 60 # Increased - still improving at epoch 32
  weight_decay: 0.10 # Increased - combat Dead biomass overfitting
  early_stop_patience: 15 # Increased - allow more time to converge
  backbone: timm/vit_small_patch16_dinov3.lvd1689m
  min_train_samples: 50
  backbone_freeze_threshold: 400
  max_grad_norm: 1.0
  backbone_lr_factor: 0.05 # Reduced to 0.05 to ensure backbone changes very slowly

training:
  freeze_backbone: true # FROZEN - use DINOv3's general features to avoid species overfitting
  backbone_freeze_fraction: 0.8 # Only used if freeze_backbone=true
  use_tta: true
  fusion_dim: 256
  biomass_feat_weight: 50.0 # Massively increased - focus on visual biomass
  aux_feat_weight: 0.05 # Further reduced - minimize interaction oscillations
  species_feat_weight: 0.0 # DISABLED - causing oscillations, conflicts with frozen backbone
  consistency_weight: 5.0 # Increased - Dead loss diverging, need stronger physics constraint
  # Exponential moving average decay for smoothing scheduler score (0..1)
  # Higher values -> smoother (less responsive). Default: 0.9
  ema_decay: 0.9

augmentation:
  tile_prob: 0.0 # Disabled - causing too much noise in holdout predictions
  mixup_prob: 0.0
  mixup_alpha: 0.40

features:
  use_bin_features: false
  bin_encoding: "ordinal"
  use_species_count_feature: true
  biomass_composite_bins: 3
  # Enhanced HSV feature configuration
  hsv_biomass_scores:
    enabled: true
    # HSV range tuning for different matter types
    green_vegetation:
      hue_range: [40, 80]
      saturation_min: 70
      value_min: 50
    dry_green_vegetation:
      hue_range: [25, 40]
      saturation_range: [40, 255]
    clover:
      hue_range: [35, 55]
      saturation_min: 120
    dead_matter:
      hue_range: [10, 25]
      saturation_range: [40, 200]
    soil:
      saturation_max: 50
      value_range: [20, 150]
    # Intelligent tiling configuration
    intelligent_tiling:
      enabled: true
      hsv_blend_factor: 0.7 # How much to trust HSV vs uniform scaling (0.0-1.0)
      min_tile_weight: 0.05 # Minimum weight per tile (prevents extreme values)
      max_tile_weight: 0.8 # Maximum weight per tile

loss:
  use_standardized_loss: true
  use_weighted_regression_loss: true
  reg_loss_type: "smoothl1" # options: smoothl1, mse

targets:
  cols: ["Dry_Green_g", "Dry_Dead_g", "Dry_Clover_g", "GDM_g", "Dry_Total_g"]
  official_weights: [0.1, 0.1, 0.1, 0.2, 0.5]
  biomass_clamp: 2500.0 # grams - max realistic biomass for dense pasture

species_taxonomy:
  core_species:
    [
      "clover",
      "whiteclover",
      "subcloverdalkeith",
      "subcloverlosa",
      "ryegrass",
      "phalaris",
      "fescue",
      "lucerne",
      "barleygrass",
      "silvergrass",
      "speargrass",
      "bromegrass",
      "capeweed",
      "crumbweed",
    ]
  groups:
    legume:
      ["clover", "whiteclover", "subcloverdalkeith", "subcloverlosa", "lucerne"]
    grass:
      [
        "ryegrass",
        "phalaris",
        "fescue",
        "barleygrass",
        "silvergrass",
        "speargrass",
        "bromegrass",
      ]
    weed: ["capeweed", "crumbweed"]

upsample:
  enabled: true
  target_min_samples: 15 # Reduced from 25 to avoid overwhelming training with synthetic data
  method: "smart"
  noise_scale: 0.025
  seasonal_drift: true
  day_shift_prob: 0.6
  drift_strength: 0.15

split:
  holdout_pct: 0.1
  stratification_key: "State_Species" # Simplified stratification for better performance
  min_train_per_combo: 3 # Reduced minimum for more flexibility
  # Coverage enforcement - simplified
  ensure_species_train_coverage: true
  species_col: "Species"
  min_train_per_species: 3
  ensure_combo_train_coverage: true # Disabled for simplicity
  combo_col: "Season_State_Species"
  min_train_per_combo_key: 3
  group_stratification_col: "Season"
  group_col: "SessionID"

seasons:
  month_map:
    1: "summer"
    2: "summer"
    12: "summer"
    3: "autumn"
    4: "autumn"
    5: "autumn"
    6: "winter"
    7: "winter"
    8: "winter"
    9: "spring"
    10: "spring"
    11: "spring"
  drift:
    spring:
      Dry_Green_g: 1.0
      Dry_Dead_g: -0.4
      Dry_Clover_g: 0.4
    summer:
      Dry_Green_g: 0.6
      Dry_Dead_g: -0.3
      Dry_Clover_g: 0.3
    autumn:
      Dry_Green_g: -0.2
      Dry_Dead_g: 0.2
      Dry_Clover_g: -0.2
    winter:
      Dry_Green_g: -0.2
      Dry_Dead_g: 1.0
      Dry_Clover_g: -0.2
