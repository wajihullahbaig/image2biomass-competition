# Configuration for Dual-Stream DINO Image2Biomass Prediction Pipeline

preprocessing:
  image_height: 518
  image_width: 518
  dual_stream: true

hyperparameters:
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  n_folds: 5
  epochs: 34
  weight_decay: 0.05
  early_stop_patience: 12
  backbone: vit_small_patch14_dinov2 # Fast 21M foundation model with native 518x518 patch14
  max_grad_norm: 1.0
  random_seed: 42

training:
  stage1_epochs: 6 # Warm-up for 3 regression & classification heads (backbone frozen)
  stage2_epochs: 22 # End-to-end pasture adaptation (backbone unfrozen, lr 3e-5)
  stage3_epochs: 6 # Head calibration (backbone re-frozen, lr 3e-5)
  stage2_warmup_epochs: 3 # Linear warmup for Stage 2 to eliminate unfreezing shock
  stage2_backbone_lr_factor: 0.1 # Differential LR for backbone (3e-5)
  stage3_lr_factor: 0.1
  fusion_dim: 384
  dropout: 0.3
  use_tta: true

augmentation:
  camera_scaling_prob: 0.2
  strip_shuffle_prob: 0.5
  view_swap_prob: 0.5

loss:
  reg_loss_type: "smoothl1"
  num_intervals: 7
  cls_weight: 0.2

targets:
  cols: ["Dry_Green_g", "Dry_Dead_g", "Dry_Clover_g"]
  all_cols:
    ["Dry_Green_g", "Dry_Dead_g", "Dry_Clover_g", "GDM_g", "Dry_Total_g"]
  official_weights: [0.1, 0.1, 0.1, 0.2, 0.5]

split:
  n_splits: 5
  group_col: "Sampling_Date"
  group_stratification_col: "State"
